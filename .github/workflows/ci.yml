name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-convert:
    name: Tests & USD conversion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest --tb=short

      - name: Generate USD artifacts
        run: uv run python scripts/generate_usd_artifacts.py --out-dir usd_artifacts

      - name: Upload USD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usd-materials
          path: usd_artifacts/*.usd
          if-no-files-found: error
