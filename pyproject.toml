[project]
name = "materials-processor"
description = "Cross-DCC material ingestion, standardization, and conversion tools."
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
materials-processor = "materials_processor.cli:main"
materials-processor-blender = "materials_processor.dcc.blender.cli:main"
materials-processor-maya = "materials_processor.dcc.maya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "usd-core>=26.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/materials_processor"]

[tool.hatch.version]
path = "src/materials_processor/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "hython: local Houdini integration tests that run through hython when available",
    "maya: local Maya integration tests that run through mayapy when available",
    "blender: local Blender integration tests that run through blender.exe when available",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B007",
    "B018",
    "B020",
    "B905",
    "E501",
    "E722",
    "F401",
    "F841",
    "I001",
]
